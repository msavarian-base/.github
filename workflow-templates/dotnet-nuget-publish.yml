name: Publish

# Push a version tag (v1.2.3) to publish to nuget.org with Trusted Publishing (no API key) and to the
# organization's GitHub Packages feed. nuget.org versions are unlisted right after the push; the Trusted Publishing
# policy needs the "Unlist or relist package versions" scope.
# Needs: a nuget.org Trusted Publishing policy for this repository with Workflow File `publish.yml` and
# Environment `nuget`, and the NUGET_USER secret (nuget.org profile name) in the `nuget` environment.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    uses: msavarian-base/.github/.github/workflows/dotnet-nuget-pack.yml@v1
    with:
      solution: CHANGE_ME.slnx

  github-packages:
    needs: pack
    permissions:
      packages: write
    uses: msavarian-base/.github/.github/workflows/dotnet-github-packages-push.yml@v1

  push:
    name: Push to nuget.org
    needs: pack
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: packages
          path: artifacts

      - name: NuGet login (OIDC → temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      # Packages are published unlisted (restorable by exact version, hidden from search). nuget.org cannot receive a
      # package as unlisted, so each pushed version is unlisted right after the push; the Trusted Publishing policy
      # needs the "Unlist or relist package versions" scope.
      - name: Unlist
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for package in artifacts/*.nupkg; do
            nuspec=$(unzip -p "$package" '*.nuspec')
            id=$(grep -oPm1 '(?<=<id>)[^<]+' <<< "$nuspec")
            version=$(grep -oPm1 '(?<=<version>)[^<]+' <<< "$nuspec")
            for attempt in 1 2 3 4 5; do
              if dotnet nuget delete "$id" "$version" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --non-interactive; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "::error::Could not unlist $id $version"
                exit 1
              fi
              sleep 30
            done
          done
