name: .NET template pack

# Reusable workflow: pack a `dotnet new` template package, install it, generate a solution from it for each
# variant, and build and test what was generated. The package is uploaded as the `packages` artifact only from
# a run where every variant passed; the caller pushes it (see workflow-templates/dotnet-template-publish.yml).
# On a tag (v10.0.1) the tagged commit must be on `main` and the package version must equal the tag without the `v`.
#
#   jobs:
#     pack:
#       uses: msavarian-base/.github/.github/workflows/dotnet-template-pack.yml@v1
#       with:
#         template-project: CleanArch.Templates.csproj
#         short-name: msavarian-ca
#         variants: '["--db sqlserver --auth none", "--db postgresql --auth jwt"]'

on:
  workflow_call:
    inputs:
      template-project:
        description: Template package project to `dotnet pack`
        type: string
        required: true
      short-name:
        description: Short name passed to `dotnet new`
        type: string
        required: true
      variants:
        description: JSON array of extra `dotnet new` arguments; one generated solution per entry
        type: string
        default: '[""]'
      generated-name:
        description: Name (`-n`) of the generated solution; the solution file is `<name>.slnx`
        type: string
        default: Smoke.Service
      run-tests:
        description: Run `dotnet test` on each generated solution
        type: boolean
        default: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  pack:
    name: Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag is on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main; release only from tags on main"
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack "${{ inputs.template-project }}" -c Release -o artifacts

      - name: Check package version against the tag
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          status=0
          for package in artifacts/*.nupkg; do
            if [[ "$package" != *".$version.nupkg" ]]; then
              echo "::error::$(basename "$package") does not match tag $GITHUB_REF_NAME"
              status=1
            fi
          done
          exit $status

      - name: Upload template package
        uses: actions/upload-artifact@v7
        with:
          name: template-package
          path: artifacts/*.nupkg

  smoke:
    name: Generate and test (${{ matrix.args || 'defaults' }})
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        args: ${{ fromJSON(inputs.variants) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v7
        with:
          name: template-package
          path: artifacts

      - name: Install template
        run: dotnet new install ./artifacts/*.nupkg

      - name: Generate a solution
        env:
          ARGS: ${{ matrix.args }}
        # ARGS is split into words on purpose.
        run: dotnet new "${{ inputs.short-name }}" -n "${{ inputs.generated-name }}" -o "$RUNNER_TEMP/generated" $ARGS

      - name: Build
        working-directory: ${{ runner.temp }}/generated
        run: dotnet build "${{ inputs.generated-name }}.slnx" -c Release

      - name: Test
        if: inputs.run-tests
        working-directory: ${{ runner.temp }}/generated
        run: dotnet test --solution "${{ inputs.generated-name }}.slnx" --no-build -c Release

  publish-artifact:
    name: Release package artifact
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: template-package
          path: artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/*.nupkg
