name: .NET NuGet pack

# Reusable workflow: test and pack NuGet packages, and upload them as the `packages` artifact.
# When it runs on a tag (v10.0.1), every package version must equal the tag without the `v`.
#
# Pushing is done by a job in the caller's own workflow, so the nuget.org Trusted Publishing policy can name
# that file (publish.yml). See workflow-templates/dotnet-nuget-publish.yml for the full caller.
#
#   jobs:
#     pack:
#       uses: msavarian-base/.github/.github/workflows/dotnet-nuget-pack.yml@main
#       with:
#         solution: Acme.Lib.slnx

on:
  workflow_call:
    inputs:
      solution:
        description: Solution to test before packing
        type: string
        required: true
      pack-target:
        description: Project or solution to pack (defaults to `solution`)
        type: string
        default: ''
      run-tests:
        description: Run `dotnet test` on the solution before packing
        type: boolean
        default: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  pack:
    name: Test and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test
        if: inputs.run-tests
        run: dotnet test --solution "${{ inputs.solution }}" -c Release

      - name: Pack
        run: dotnet pack "${{ inputs.pack-target || inputs.solution }}" -c Release -o artifacts

      - name: Check package versions against the tag
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          status=0
          for package in artifacts/*.nupkg; do
            if [[ "$package" != *".$version.nupkg" ]]; then
              echo "::error::$(basename "$package") does not match tag $GITHUB_REF_NAME"
              status=1
            fi
          done
          exit $status

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/*.nupkg
