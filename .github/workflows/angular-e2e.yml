name: Angular end-to-end tests

# Reusable workflow: run Playwright end-to-end tests of an Angular app. The caller's playwright.config.ts starts
# the app under test (its `webServer`, for example a production build served by `ng serve` or the SSR server).
# The HTML report is uploaded as the `playwright-report` artifact.
#
#   jobs:
#     e2e:
#       uses: msavarian-base/.github/.github/workflows/angular-e2e.yml@v1

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory with package.json and playwright.config.ts
        type: string
        default: .
      node-version:
        description: Node version (empty = read `.nvmrc`)
        type: string
        default: ''
      browsers:
        description: Space-separated Playwright browsers to install
        type: string
        default: chromium
      test-args:
        description: Extra arguments for `playwright test`
        type: string
        default: ''
    secrets:
      NPM_TOKEN:
        description: >-
          Token for private npm packages, exposed to `npm ci` as NODE_AUTH_TOKEN (the repository's `.npmrc` names the
          registry). For GitHub Packages pass the caller's `secrets.GITHUB_TOKEN` and grant the job `packages: read`.
        required: false

# No permissions block: the job token gets exactly what the caller grants (callers grant at least `contents: read`;
# add `packages: read` to install private packages with NPM_TOKEN: secrets.GITHUB_TOKEN). A block here could only
# narrow it, and would take away `packages: read`.

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version == '' && format('{0}/.nvmrc', inputs.working-directory) || '' }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm ci

      - name: Install browser dependencies
        env:
          BROWSERS: ${{ inputs.browsers }}
        timeout-minutes: 10
        run: |
          read -ra browsers <<< "$BROWSERS"
          npx playwright install-deps "${browsers[@]}"

      - name: Install browsers
        env:
          BROWSERS: ${{ inputs.browsers }}
        timeout-minutes: 10
        run: |
          read -ra browsers <<< "$BROWSERS"
          npx playwright install "${browsers[@]}"

      - name: Test
        env:
          CI: true
          ARGS: ${{ inputs.test-args }}
        run: |
          read -ra args <<< "$ARGS"
          npx playwright test "${args[@]}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ${{ inputs.working-directory }}/playwright-report/
          if-no-files-found: ignore
