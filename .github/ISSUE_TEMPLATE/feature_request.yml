name: Feature request
description: A new capability or a change to an existing one
labels: [ enhancement ]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work. Mention breaking changes if any.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
