name: Bug report
description: Something does not work as documented
labels: [ bug ]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. dotnet new msavarian-ca -n Acme.Orders --db postgresql
        2. dotnet test
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Package or template version, or commit.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      render: text
